<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Friday Night Gridiron: run an Ohio high school football program.">
  <meta name="theme-color" content="#0a101c">
  <title>Friday Night Gridiron</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="desktop" data-watermark="Friday Night Gridiron">
    <nav id="desktop-icons" aria-label="Programs"></nav>
    <div id="windows"></div>
  </main>
  <footer id="taskbar"></footer>
  <div id="toasts" aria-live="polite"></div>
  <div id="busy" hidden>
    <div class="box">
      <div class="txt bold">Working...</div>
      <div class="prog"><i></i></div>
    </div>
  </div>
  <noscript><p style="padding:20px">Friday Night Gridiron needs JavaScript enabled.</p></noscript>

  <script src="js/core/util.js"></script>
  <script src="js/data/ohio.js"></script>
  <script src="js/data/names.js"></script>
  <script src="js/world/world.js"></script>
  <script src="js/world/schedule.js"></script>
  <script src="js/sim/players.js"></script>
  <script src="js/sim/team.js"></script>
  <script src="js/sim/engine.js"></script>
  <script src="js/season.js"></script>
  <script src="js/ui/dom.js"></script>
  <script src="js/ui/wm.js"></script>
  <script src="js/ui/app.js"></script>
  <script src="js/ui/setup.js"></script>
  <script src="js/ui/windows/hub.js"></script>
  <script src="js/ui/windows/roster.js"></script>
  <script src="js/ui/windows/depth.js"></script>
  <script src="js/ui/windows/schedule.js"></script>
  <script src="js/ui/windows/league.js"></script>
  <script src="js/ui/windows/schools.js"></script>
  <script src="js/ui/windows/program.js"></script>
  <script src="js/ui/windows/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
